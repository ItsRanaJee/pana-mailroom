[project]
name = "pana-mailroom"
version = "0.1.0"
description = "Command-line tool for one newsletter: count subscribers, check an issue, send it to a practice mail server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
